<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630">
    <defs>
        <style>
            @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;800&amp;display=swap');
            .text-tag {
                font-family: 'Outfit', sans-serif;
                font-weight: 700;
                font-size: 13px;
                fill: #C7FF00;
                letter-spacing: 3px;
                text-anchor: middle;
            }
            .text-title {
                font-family: 'Outfit', sans-serif;
                font-weight: 800;
                font-size: 44px;
                fill: #FDFBF7;
                letter-spacing: 1px;
                text-anchor: middle;
            }
            .text-sub {
                font-family: 'Outfit', sans-serif;
                font-weight: 400;
                font-size: 15px;
                fill: #A1A1AA;
                letter-spacing: 4px;
                text-anchor: middle;
            }
        </style>
    </defs>

    <!-- Osnovna apsolutno crna pozadina -->
    <rect width="1200" height="630" fill="#000000"/>

    <!-- Pozadina desne polovine iza teksta i logoa (#050505) -->
    <rect x="600" y="0" width="600" height="630" fill="#050505"/>

    <!-- Leva polovina (0 - 600px): Centrirana slika -->
    <image href="portrait.jpg" x="0" y="0" width="600" height="630" preserveAspectRatio="xMidYMid slice"/>

    <!-- Desna polovina (600 - 1200px): Centriran sadržaj (X centar = 900) -->
    <g transform="translate(900, 0)">
        <!-- Logo centriran -->
        <g transform="translate(0, 210) scale(0.25) translate(-360, -360)">
            <path transform="matrix(1,0,0,-1,0,720)" d="M360 120 152.544 240V480L360 600 567.456 480V240ZM360 142.48 548.024 251.24V468.76L360 577.52 171.976 468.76V251.24Z" fill="#ffffff" fill-rule="evenodd"/>
            <path transform="matrix(1,0,0,-1,0,720)" d="M448.202 206.942 360 155.923 183.596 257.962V462.038L360 564.077 448.202 513.058V404.101H360V462.129L271.798 411.205V308.775L360 257.852V315.899H448.202Z" fill="#ffffff" fill-rule="evenodd"/>
        </g>

        <!-- Centrirani tekst -->
        <text x="0" y="330" class="text-tag">PRESERVING THE HUMAN SOUL IN MUSIC</text>
        <text x="0" y="395" class="text-title">CRAFTED HERTZ</text>
        <text x="0" y="440" class="text-sub">OFFICIAL WEBSITE</text>
    </g>
</svg>
